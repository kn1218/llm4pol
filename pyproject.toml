[project]
name = "llm4pol"
version = "0.0.1"
requires-python = ">=3.13"
description = "LLM4POL -- port of LLM4MOF (interpretable inverse design with LLM agents) to the polymer domain. Pre-charter scaffold."

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]
# Restrict ruff's scan (both `check` and `format`) to this project's own
# code: GSD framework templates, planning docs, audit reports and the pixi
# environment are not this project's source.
extend-exclude = [".claude", ".planning", ".gsd", ".omc", "docs", "env", "data"]

[tool.ruff.lint.isort]
# `llm4pol` is first-party by declaration, not by discovery: isort's default
# classification looks the dotted module path up on disk, so a test that
# imports a submodule before its GREEN commit creates it (the TDD RED state)
# would be sorted as third-party and re-sorted after GREEN (plan 02-01 hit
# this; plan 03-01 pins it here).
known-first-party = ["llm4pol"]

[tool.mypy]
python_version = "3.13"
packages = ["llm4pol"]
# `typings` holds hand-written stubs that mypy searches BEFORE installed stub
# packages: rdkit 2026.03.6 ships an rdkit-stubs package whose
# Chem/rdchem.pyi (line 360) is a syntax error mypy 2.3.1 treats as blocking,
# and neither follow_imports=skip nor ignore_errors suppresses it.
mypy_path = ["src", "typings"]
strict = true

[[tool.mypy.overrides]]
# pandas, pyarrow and jsonschema ship neither stubs nor py.typed. Their values
# are `Any` under this override; typed functions convert to builtins before
# returning. Overrides are used instead of stub packages so no unaudited
# package enters env/pixi.lock (T-02-SC).
module = ["pandas.*", "pyarrow.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "llm4pol"
include_external_packages = true

# First contract (charter section 6 package boundary; CONTEXT D-8). The
# `forbidden` type is used because an `independence` contract over a single
# module is vacuous -- it enforces nothing. The forbidden llm4pol modules do
# not exist yet; import-linter accepts that and reports the contract KEPT.
# Phase 3 (EVAL-06) widened this to the full boundary table: the three
# contracts below (A-1, A-2 and the llm rule) landed in plan 03-03.
[[tool.importlinter.contracts]]
name = "llm4pol.data is independent of every other llm4pol subpackage (charter §6) and never imports a splitter (D-8)"
type = "forbidden"
source_modules = ["llm4pol.data"]
forbidden_modules = ["llm4pol.evaluate", "llm4pol.run", "llm4pol.loop", "llm4pol.llm", "sklearn"]

# A-1 (charter section 6 row `evaluate`): the evaluator never reaches the loop,
# the LLM adapter or run management. The forbidden modules do not exist yet;
# import-linter skips absent forbidden modules and reports KEPT (RESEARCH F-18).
[[tool.importlinter.contracts]]
name = "A-1: llm4pol.evaluate never imports llm4pol.loop, llm4pol.llm or llm4pol.run (charter section 6)"
type = "forbidden"
source_modules = ["llm4pol.evaluate"]
forbidden_modules = ["llm4pol.loop", "llm4pol.llm", "llm4pol.run"]

# A-2 (ADR-0003): the loop never imports the simulation backend. Written as a
# layers contract with BOTH layers optional (parentheses) because a `forbidden`
# contract errors when its source module does not exist (F-19) and
# `llm4pol.loop` is created in Phase 5; a wildcard source `llm4pol.loop.*`
# would miss an import placed in loop/__init__.py (F-21). KEPT while absent,
# BROKEN the moment llm4pol.loop (or any module under it) imports the backend,
# including from loop/__init__.py (F-22; tests/test_import_boundary.py proves
# it on a scratch copy). Phase 5 may rewrite it as `forbidden` once the
# package exists.
[[tool.importlinter.contracts]]
name = "A-2: llm4pol.loop never imports llm4pol.evaluate.backends.radonpy (ADR-0003, charter section 6)"
type = "layers"
layers = ["(llm4pol.evaluate.backends.radonpy)", "(llm4pol.loop)"]

# EVAL-06 third clause (charter section 6 row `llm`): only llm4pol.loop.agents
# may import llm4pol.llm. Wildcard source covers every present and future
# subpackage; the agents package is exempted through ignore_imports (F-23).
# The converse rule -- llm imports nothing of llm4pol -- needs
# `source_modules = ["llm4pol.llm"]` and lands in Phase 6 when the package
# exists. Added per REQUIREMENTS.md EVAL-06, which outranks the deferral in
# 03-CONTEXT.md R-1 (CLAUDE.md precedence); flagged for the owner -- reversal
# is this block and one test.
[[tool.importlinter.contracts]]
name = "A-1: only llm4pol.loop.agents may import llm4pol.llm (charter section 6, EVAL-06)"
type = "forbidden"
source_modules = ["llm4pol.*"]
forbidden_modules = ["llm4pol.llm"]
ignore_imports = [
    "llm4pol.loop.agents -> llm4pol.llm",
    "llm4pol.loop.agents -> llm4pol.llm.*",
    "llm4pol.loop.agents.* -> llm4pol.llm",
    "llm4pol.loop.agents.* -> llm4pol.llm.*",
]
unmatched_ignore_imports_alerting = "none"

# Explicit schema-validation inventory (CONTEXT D-06; precedent [tool.calfcheck]):
# a sibling-schema discovery rule would let a deleted or renamed schema silently
# remove its own validation. This table is authoritative and non-empty by
# construction -- a missing [tool.llm4polcheck] table is itself a check failure
# (scripts/check.py::validate_inventory, step `schema-inventory`). YAML instances
# are validated exactly like JSON ones. The config/*.json sibling-schema pairing
# test (tests/test_governance.py) stays; this table covers protocol/ instances.
# Entry shape (each [[tool.llm4polcheck.validated]] table):
#   name      = human-readable identifier for the validated artifact
#   instances = glob (relative to repo root) matching the file(s) to validate
#   schema    = path (relative to repo root) to the JSON Schema file
#   required  = bool; when true, a zero-match instances glob is a failure
# protocol/examples/ holds the committed instances of the evaluator schemas
# (charter section 13 M2 (5)): every value in them is an invented synthetic-
# fixture value, never a data row, and the response example is the evaluator's
# own output on the synthetic table (tests/test_evaluate_contract.py).
[tool.llm4polcheck]
validated = [
    { name = "property registry v1 (DATA-03, A-7)", instances = "protocol/property-registry_v1.yaml", schema = "protocol/schemas/property-registry.json", required = true },
    { name = "evaluator request example (EVAL-01)", instances = "protocol/examples/eval-request.example.json", schema = "protocol/schemas/eval-request.json", required = true },
    { name = "evaluator response example (EVAL-01)", instances = "protocol/examples/eval-response.example.json", schema = "protocol/schemas/eval-response.json", required = true },
]
