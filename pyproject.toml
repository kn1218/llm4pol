[project]
name = "llm4pol"
version = "0.0.1"
requires-python = ">=3.13"
description = "LLM4POL -- port of LLM4MOF (interpretable inverse design with LLM agents) to the polymer domain. Pre-charter scaffold."

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]
# Restrict ruff's scan (both `check` and `format`) to this project's own
# code: GSD framework templates, planning docs, audit reports and the pixi
# environment are not this project's source.
extend-exclude = [".claude", ".planning", ".gsd", ".omc", "docs", "env", "data"]

[tool.mypy]
python_version = "3.13"
packages = ["llm4pol"]
# `typings` holds hand-written stubs that mypy searches BEFORE installed stub
# packages: rdkit 2026.03.6 ships an rdkit-stubs package whose
# Chem/rdchem.pyi (line 360) is a syntax error mypy 2.3.1 treats as blocking,
# and neither follow_imports=skip nor ignore_errors suppresses it.
mypy_path = ["src", "typings"]
strict = true

[[tool.mypy.overrides]]
# pandas, pyarrow and jsonschema ship neither stubs nor py.typed. Their values
# are `Any` under this override; typed functions convert to builtins before
# returning. Overrides are used instead of stub packages so no unaudited
# package enters env/pixi.lock (T-02-SC).
module = ["pandas.*", "pyarrow.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "llm4pol"
include_external_packages = true

# First contract (charter section 6 package boundary; CONTEXT D-8). The
# `forbidden` type is used because an `independence` contract over a single
# module is vacuous -- it enforces nothing. The forbidden llm4pol modules do
# not exist yet; import-linter accepts that and reports the contract KEPT.
# Phase 3 (EVAL-06) widens this to the full boundary table.
[[tool.importlinter.contracts]]
name = "llm4pol.data is independent of every other llm4pol subpackage (charter §6) and never imports a splitter (D-8)"
type = "forbidden"
source_modules = ["llm4pol.data"]
forbidden_modules = ["llm4pol.evaluate", "llm4pol.run", "llm4pol.loop", "llm4pol.llm", "sklearn"]

# Explicit schema-validation inventory (CONTEXT D-06; precedent [tool.calfcheck]):
# a sibling-schema discovery rule would let a deleted or renamed schema silently
# remove its own validation. This table is authoritative and non-empty by
# construction -- a missing [tool.llm4polcheck] table is itself a check failure
# (scripts/check.py::validate_inventory, step `schema-inventory`). YAML instances
# are validated exactly like JSON ones. The config/*.json sibling-schema pairing
# test (tests/test_governance.py) stays; this table covers protocol/ instances.
# Entry shape (each [[tool.llm4polcheck.validated]] table):
#   name      = human-readable identifier for the validated artifact
#   instances = glob (relative to repo root) matching the file(s) to validate
#   schema    = path (relative to repo root) to the JSON Schema file
#   required  = bool; when true, a zero-match instances glob is a failure
[tool.llm4polcheck]
validated = [
    { name = "property registry v1 (DATA-03, A-7)", instances = "protocol/property-registry_v1.yaml", schema = "protocol/schemas/property-registry.json", required = true },
]
